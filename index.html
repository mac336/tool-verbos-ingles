<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El cole</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D9F1FF; --bg2:#BEE5FF; --card:#FFFFFF; --ink:#2B2350; --soft:#6B6491; --line:#E6E1FA;
  --grape:#7B5CFF; --mint:#2FC48D; --sky:#3B8EF0; --pink:#E8479A; --orange:#F2711C;
  box-sizing:border-box; color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#1B1F45; --bg2:#232860; --card:#2C3170; --ink:#F4F2FF; --soft:#B9B5E0; --line:#3E4488; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#1B1F45; --bg2:#232860; --card:#2C3170; --ink:#F4F2FF; --soft:#B9B5E0; --line:#3E4488; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{
  background:var(--bg);
  background-image:
    radial-gradient(circle at 12% 8%, var(--bg2) 0 60px, transparent 61px),
    radial-gradient(circle at 92% 22%, var(--bg2) 0 90px, transparent 91px),
    radial-gradient(circle at 6% 70%, var(--bg2) 0 70px, transparent 71px),
    radial-gradient(circle at 96% 92%, var(--bg2) 0 80px, transparent 81px);
  background-attachment:fixed;
  color:var(--ink); font-family:"Fredoka","Baloo 2","Comic Sans MS",system-ui,sans-serif;
  font-size:19px; line-height:1.35; min-height:100vh;
}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.hello{display:flex;align-items:flex-end;gap:10px;margin:6px 0 22px}
.owl{font-size:4.2rem;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.bubble{background:var(--card);border-radius:22px 22px 22px 6px;padding:12px 16px;box-shadow:0 4px 0 var(--line);font-weight:500}
.bubble h1{margin:0;font-size:1.7rem;line-height:1.1;font-weight:700}
.bubble p{margin:2px 0 0;color:var(--soft)}
.course{background:var(--card);border-radius:28px;padding:14px;box-shadow:0 6px 0 var(--line);margin-bottom:18px}
.course h2{margin:0 0 10px 6px;font-size:1.35rem}
.subj{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;border-radius:22px;padding:14px 16px;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .12s, box-shadow .12s;min-height:84px}
.subj:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.subj + .subj{margin-top:12px}
.subj .ico{font-size:2.6rem;line-height:1}
.subj b{display:block;font-size:1.35rem}
.subj span{display:block;font-size:.95rem;opacity:.95}
.s-en{background:linear-gradient(135deg,var(--sky),var(--grape))}
.s-hi{background:linear-gradient(135deg,var(--orange),var(--pink))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hello">
    <div class="owl" aria-hidden="true">🎒</div>
    <div class="bubble"><h1>¡Hola! ¿Qué estudiamos?</h1><p>Elige el curso y la asignatura.</p></div>
  </div>
  <section class="course">
    <h2>6º Primaria</h2>
    <a class="subj s-en" href="6-primaria/ingles/"><span class="ico" aria-hidden="true">🇬🇧</span><div><b>Inglés</b><span>Verbos irregulares · juegos y examen</span></div></a>
  </section>
  <section class="course">
    <h2>1º ESO</h2>
    <a class="subj s-hi" href="1-eso/history/"><span class="ico" aria-hidden="true">🗿</span><div><b>History</b><span>Prehistory: Neolithic, Metals, Megaliths</span></div></a>
  </section>
</div>
</body>
</html>
