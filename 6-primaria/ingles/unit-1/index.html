<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inglés 6º</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📘</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D9F1FF; --bg2:#BEE5FF; --card:#FFFFFF; --ink:#2B2350; --soft:#6B6491; --line:#E6E1FA;
  --sun:#FFD23F; --grape:#7B5CFF; --mint:#2FC48D; --coral:#FF6B6B; --sky:#3B8EF0; --pink:#E8479A; --orange:#F2711C; --clay:#B8642E;
  --okbg:#DFF8EC; --ok:#178A5E; --badbg:#FFE6E6; --bad:#D63A3A; --chip:#F3F0FF; --part:#FFF4CC; --partink:#8A6A00;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1F45; --bg2:#232860; --card:#2C3170; --ink:#F4F2FF; --soft:#C3BCE6; --line:#4C3F78; --clay:#F0A070;
    --okbg:#174A3C; --ok:#6DF0B9; --badbg:#5A2238; --bad:#FF9A9A; --chip:#463A70; --part:#4D4220; --partink:#FFE38A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1F45; --bg2:#232860; --card:#2C3170; --ink:#F4F2FF; --soft:#C3BCE6; --line:#4C3F78; --clay:#F0A070;
  --okbg:#174A3C; --ok:#6DF0B9; --badbg:#5A2238; --bad:#FF9A9A; --chip:#463A70; --part:#4D4220; --partink:#FFE38A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{
  background:var(--bg);
  background-image:
    radial-gradient(circle at 12% 8%, var(--bg2) 0 60px, transparent 61px),
    radial-gradient(circle at 92% 22%, var(--bg2) 0 90px, transparent 91px),
    radial-gradient(circle at 6% 70%, var(--bg2) 0 70px, transparent 71px),
    radial-gradient(circle at 96% 92%, var(--bg2) 0 80px, transparent 81px);
  background-attachment:fixed;
  color:var(--ink); font-family:"Fredoka","Baloo 2","Comic Sans MS",system-ui,sans-serif;
  font-size:19px; line-height:1.35; min-height:100vh;
}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 40px}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
[hidden]{display:none!important}
img{max-width:100%}

.crumb{display:inline-block;margin:0 0 6px;padding:6px 14px;border-radius:16px;background:var(--card);box-shadow:0 3px 0 var(--line);color:var(--ink);text-decoration:none;font-weight:600}
.hello{display:flex;align-items:flex-end;gap:10px;margin:6px 0 16px;padding-right:46px}
.owl{font-size:4rem;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.bubble{background:var(--card);border-radius:22px 22px 22px 6px;padding:12px 16px;box-shadow:0 4px 0 var(--line);font-weight:500}
.bubble h1{margin:0;font-size:1.6rem;line-height:1.1;font-weight:700}
.bubble p{margin:2px 0 0;color:var(--soft)}

details.help{background:var(--card);border-radius:20px;padding:10px 14px;margin:0 0 14px;box-shadow:0 4px 0 var(--line)}
details.help summary{cursor:pointer;font-weight:700}
details.help ul{margin:8px 0 2px;padding-left:20px;font-size:.95rem}
details.help li{margin-bottom:4px}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border:none;border-radius:26px;padding:16px 12px 14px;cursor:pointer;text-align:center;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .12s, box-shadow .12s}
.mode:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.mode .ico{display:block;font-size:2.6rem;line-height:1.1}
.mode b{display:block;font-size:1.2rem;font-weight:700;margin-top:4px}
.mode span{display:block;font-size:.85rem;opacity:.95;line-height:1.25;margin-top:2px}
.m-study{background:var(--mint)} .m-flash{background:var(--grape)} .m-prac{background:var(--sky);grid-column:1/-1}
.listen{border:none;background:var(--card);border-radius:14px;padding:4px 12px;margin-top:8px;cursor:pointer;font-weight:600;box-shadow:0 2px 0 var(--line)}
.why{margin-top:6px;font-weight:500;color:var(--ink)}
.exam-card{display:block;width:100%;margin-top:14px;border:none;border-radius:26px;padding:16px 14px;cursor:pointer;text-align:center;color:#fff;
  background:linear-gradient(135deg,var(--orange),var(--pink));box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .12s, box-shadow .12s}
.exam-card:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.exam-card .ico{display:block;font-size:2.6rem;line-height:1.1}
.exam-card b{display:block;font-size:1.45rem;font-weight:700;letter-spacing:.5px;margin-top:4px}
.exam-card span{display:block;font-size:.9rem;opacity:.95;margin-top:2px}
.exam-info{background:var(--card);border-radius:20px;padding:10px 14px;margin-top:12px;box-shadow:0 4px 0 var(--line);text-align:center;font-weight:500}
.exam-info .row2 .go{margin-top:10px;font-size:1.05rem;padding:10px}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;padding-right:52px}
.back{border:none;background:var(--card);border-radius:16px;padding:6px 14px;cursor:pointer;font-weight:600;box-shadow:0 3px 0 var(--line)}
.title{font-weight:700;font-size:1.1rem;text-align:right}
.track{position:relative;height:18px;background:var(--card);border-radius:12px;margin:6px 26px 6px 0;box-shadow:inset 0 2px 0 var(--line)}
.track i{display:block;height:100%;border-radius:12px;background:var(--sun);transition:width .4s}
.track .rocket{position:absolute;top:50%;transform:translate(-30%,-55%);font-size:1.6rem;transition:left .4s}
.stats{display:flex;justify-content:space-between;color:var(--soft);font-weight:500;margin:8px 0 14px;gap:8px}

.q{background:var(--card);border-radius:30px;padding:20px 18px;box-shadow:0 8px 0 var(--line)}
.prompt{color:var(--soft);margin:0 0 4px;font-size:1.05rem;font-weight:500;text-align:center}
.ins{text-align:center;font-weight:700;font-size:1.15rem;color:var(--grape);margin:0 0 4px}
.ex{text-align:center;color:var(--soft);font-size:.95rem;margin:0 0 8px}
.ex b{color:var(--ink)}
details.es{margin:0 auto 10px;width:max-content;max-width:100%;background:var(--chip);border-radius:14px;padding:4px 12px;font-size:.95rem}
details.es summary{cursor:pointer;font-weight:700;color:var(--soft)}
details.es div{margin-top:4px}
.kind{display:block;width:max-content;margin:0 auto 8px;background:var(--chip);border-radius:12px;padding:2px 12px;font-size:.85rem;font-weight:700;color:var(--soft)}
.ask{font-size:1.45rem;font-weight:600;text-align:center;margin:4px 0 14px;line-height:1.3}
.ask .blank{display:inline-block;min-width:3.5em;border-bottom:4px solid var(--grape);color:var(--grape)}
.qimg{display:block;margin:0 auto 14px;max-height:300px;border-radius:18px;cursor:zoom-in;background:#fff}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:none;border-radius:20px;padding:12px 14px;min-height:60px;cursor:pointer;color:#fff;font-size:1.12rem;font-weight:600;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .1s, opacity .2s;text-align:center}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.opts .opt:nth-child(4n+1){background:var(--sky)} .opts .opt:nth-child(4n+2){background:var(--pink)}
.opts .opt:nth-child(4n+3){background:var(--orange)} .opts .opt:nth-child(4n+4){background:var(--grape)}
.opts.tf .opt:nth-child(1){background:var(--mint)} .opts.tf .opt:nth-child(2){background:var(--coral)}
.opts.tf .opt{font-size:1.4rem;min-height:72px}
.opt:disabled{cursor:default;transform:none}
.opt.dim{opacity:.3}
.opt.ok{background:var(--mint)!important;opacity:1;animation:pop .35s}
.opt.ok::after{content:" ✓"}
.opt.bad{background:var(--bad)!important;opacity:1;animation:shake .4s}
.opt.bad::after{content:" ✗"}
@keyframes pop{50%{transform:scale(1.05)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

input[type=text]{width:100%;font:inherit;font-size:1.6rem;font-weight:600;text-align:center;padding:10px 14px;border-radius:22px;border:4px solid var(--line);background:var(--chip);color:var(--ink)}
input[type=text]:focus{border-color:var(--grape);outline:none}
input.ok{border-color:var(--mint)!important;background:var(--okbg)}
input.bad{border-color:var(--bad)!important;background:var(--badbg);animation:shake .4s}

.go{display:block;margin-top:14px;width:100%;border:none;border-radius:22px;padding:14px;cursor:pointer;font-size:1.25rem;font-weight:700;background:var(--sun);color:#2B2350;box-shadow:0 6px 0 #D9A800;transition:transform .1s, box-shadow .1s}
.go:active{transform:translateY(5px);box-shadow:0 1px 0 #D9A800}
.go.alt{background:var(--chip);color:var(--ink);box-shadow:0 6px 0 var(--line)}
.go.small{font-size:1rem;padding:10px}
.go:disabled{opacity:.4;cursor:default;transform:none}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}

.fb{margin-top:16px;border-radius:22px;padding:12px 16px}
.fb.ok{background:var(--okbg);color:var(--ok);font-weight:700;font-size:1.3rem;text-align:center}
.fb.bad{background:var(--badbg)}
.fb.part{background:var(--part);color:var(--partink)}
.fb .head{font-weight:700;font-size:1.15rem}
.fb.bad .head{color:var(--bad)}
.fb .right{font-weight:600;margin-top:4px}

/* Unir */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mt{border:3px solid var(--line);background:var(--chip);border-radius:16px;padding:10px 8px;min-height:56px;cursor:pointer;font-weight:600;font-size:1rem;line-height:1.2;position:relative}
.mt.sel{border-color:var(--grape);background:color-mix(in srgb,var(--grape) 18%,var(--chip))}
.mt[data-p]{color:#fff;border-color:transparent}
.mt[data-p]::before{content:attr(data-p);position:absolute;top:-8px;left:-6px;background:var(--card);color:var(--ink);border-radius:50%;width:24px;height:24px;font-size:.8rem;line-height:24px;box-shadow:0 2px 0 var(--line)}
.p1{background:var(--sky)!important} .p2{background:var(--pink)!important} .p3{background:var(--orange)!important} .p4{background:var(--grape)!important} .p5{background:var(--clay)!important}
.mt.okm{outline:4px solid var(--mint)} .mt.badm{outline:4px solid var(--bad)}
.mres{margin-top:12px}
.mres div{background:var(--chip);border-radius:14px;padding:6px 12px;margin-bottom:6px;font-size:1rem}

/* Ordenar */
.seq{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;min-height:40px;border:3px dashed var(--line);border-radius:18px;padding:8px}
.seq .it{background:var(--sky);color:#fff;border-radius:14px;padding:8px 12px;font-weight:600}
.seq .it b{display:inline-block;width:1.6em}
.seq .it.okm{background:var(--mint)} .seq .it.badm{background:var(--bad)}
.seq.words{flex-direction:row;flex-wrap:wrap;align-items:center;min-height:58px}
.seq.words .it{padding:6px 10px}
.seq.words.okm{border-color:var(--mint);border-style:solid} .seq.words.badm{border-color:var(--bad);border-style:solid}
.hint{text-align:center;font-weight:600;color:var(--grape);margin:0 0 10px}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pool button{border:3px solid var(--line);background:var(--chip);border-radius:16px;padding:10px 14px;min-height:52px;cursor:pointer;font-weight:600}

/* Mapa */
.map{position:relative;margin:0 auto 12px;border-radius:14px;overflow:hidden;background:#fff}
.map img{display:block;width:100%;height:auto}
.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:var(--grape);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.35);padding:0}
.pin.okm{background:var(--mint)} .pin.badm{background:var(--bad)}
.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.nums button{border:none;border-radius:16px;min-height:56px;background:var(--grape);color:#fff;font-weight:700;font-size:1.3rem;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}

/* Examen con el padre */
.parent{background:var(--chip);border-radius:16px;padding:6px 12px;margin:0 0 12px;color:var(--soft);font-size:.95rem;text-align:center}
.answer{margin-top:14px;border-radius:22px;padding:14px;background:var(--okbg);font-weight:500}
.mark{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.mark button{border:none;border-radius:22px;min-height:72px;font-size:1.4rem;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.mark button:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.mark .yes{background:var(--mint)} .mark .no{background:var(--bad)}
.lenpick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 4px}
.lenpick button{border:3px solid var(--line);background:var(--chip);border-radius:16px;padding:8px 16px;cursor:pointer;font-weight:700;font-size:1.1rem;min-height:52px}
.whole{display:block;width:100%;border:3px solid var(--line);background:var(--chip);border-radius:18px;padding:10px 14px;cursor:pointer;font-size:1.1rem;text-align:left;min-height:56px;margin-bottom:8px}
.whole.on{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 35%,var(--chip))}
.whole small{color:var(--soft)}
.secpick{display:flex;flex-direction:column;gap:6px}
.secpick label{display:flex;align-items:center;gap:12px;border:3px solid var(--line);background:var(--chip);border-radius:16px;padding:8px 12px;cursor:pointer;min-height:56px}
.secpick label.on{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 16%,var(--chip))}
.secpick input{width:26px;height:26px;flex:none;accent-color:var(--mint)}
.secpick b{display:block;font-size:1rem;line-height:1.2}
.secpick small{color:var(--soft);font-size:.85rem}
.sectag{display:inline-block;background:var(--card);border-radius:10px;padding:0 8px;font-size:.8rem;font-weight:700;color:var(--orange);margin-bottom:2px}
.bysec{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--chip);border-radius:14px;padding:6px 12px;margin-bottom:6px;font-size:.95rem}
.bysec b{font-size:1.2rem} .bysec b.pass{color:var(--ok)} .bysec b.fail{color:var(--bad)}
.bysec small{color:var(--soft)}
.lenpick button.on{border-color:var(--sun);background:var(--sun);color:#2B2350}
.setup ol{margin:4px 0 12px;padding-left:22px;font-weight:500;font-size:1rem}
.setup li{margin-bottom:4px}

/* Resultado */
.end{text-align:center}
.stars{font-size:3rem;letter-spacing:4px;margin:4px 0}
.stars .off{filter:grayscale(1);opacity:.3}
.big{font-size:3.6rem;font-weight:700;line-height:1;color:var(--grape)}
.big small{font-size:1.4rem;color:var(--soft)}
.score2{display:flex;justify-content:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.score2 div{border-radius:18px;padding:6px 14px;font-weight:700;font-size:1.1rem}
.score2 .y{background:var(--okbg);color:var(--ok)} .score2 .n{background:var(--badbg);color:var(--bad)} .score2 .h{background:var(--part);color:var(--partink)}
.mist{text-align:left;margin-top:18px}
.mist h3{margin:0 0 8px;font-size:1.15rem}
.mrow{background:var(--chip);border-radius:16px;padding:8px 12px;margin-bottom:8px;font-size:1rem}
.mrow .e{font-weight:600}
.mrow .f{color:var(--soft)} .mrow .f b{color:var(--ink)}

/* Fichas */
.fnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.arrow{border:none;background:var(--card);border-radius:50%;width:46px;height:46px;font-size:1.8rem;font-weight:700;cursor:pointer;line-height:1;flex:none;box-shadow:0 3px 0 var(--line)}
.arrow:disabled{opacity:.3;cursor:default}
.ftitle{text-align:center;font-weight:700;font-size:1.25rem;line-height:1.2}
.ftitle small{display:block;color:var(--soft);font-weight:500;font-size:.9rem}
.sect{background:var(--card);border-radius:24px;padding:14px 16px;box-shadow:0 6px 0 var(--line);margin-bottom:16px}
.sect h2{margin:0 0 8px;font-size:1.15rem}
.sect ul{margin:0;padding-left:20px}
.sect li{margin-bottom:6px}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gallery figure{margin:0;background:var(--chip);border-radius:16px;padding:6px;display:flex;flex-direction:column;gap:4px}
.gallery figure.wide{grid-column:1/-1}
.gallery img{width:100%;height:150px;object-fit:contain;background:#fff;border-radius:12px;cursor:zoom-in}
.gallery figure.wide img{height:auto;max-height:420px}
.gallery figcaption{font-size:.85rem;color:var(--soft);line-height:1.2;padding:0 2px 2px}
table.voc{width:100%;border-collapse:collapse;font-size:1rem}
table.voc td{padding:6px 4px;border-bottom:2px solid var(--line);vertical-align:top}
table.voc td:first-child{font-weight:600;color:var(--grape);width:48%}
table.voc button{border:none;background:none;cursor:pointer;font-size:1rem;padding:0 4px}
.dates div{display:flex;gap:10px;padding:6px 0;border-bottom:2px solid var(--line);font-size:1rem}
.dates b{flex:0 0 38%;color:var(--orange)}

/* Tarjetas */
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:8px 0}
.chips button{border:3px solid var(--line);background:var(--chip);border-radius:14px;padding:6px 12px;cursor:pointer;font-weight:600;min-height:46px}
.chips button.on{border-color:var(--sun);background:var(--sun);color:#2B2350}
.card{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.card .front{font-size:2.2rem;font-weight:700;color:var(--grape);line-height:1.15;word-break:break-word}
.card .backs{font-size:1.9rem;font-weight:700;color:var(--mint);line-height:1.15;word-break:break-word}
.speak{border:none;background:var(--chip);border-radius:50%;width:48px;height:48px;font-size:1.4rem;cursor:pointer;flex:none}

/* Visor de imagen */
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:60;padding:12px;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;border-radius:10px;background:#fff}

.confetti{position:fixed;top:-40px;font-size:1.6rem;pointer-events:none;animation:fall 1.4s ease-in forwards;z-index:50}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.8}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}
.sfx{position:fixed;top:10px;right:10px;z-index:50;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.85);box-shadow:0 2px 6px rgba(0,0,0,.2);font-size:22px;cursor:pointer}
@media (max-width:420px){ body{font-size:17px} .ask{font-size:1.25rem} .card .front{font-size:1.8rem} .gallery img{height:120px} .nums{grid-template-columns:repeat(3,1fr)} .pin{width:24px;height:24px;font-size:.75rem;border-width:2px} }
</style>
</head>
<body>
<button class="sfx" id="sfx" aria-label="Sonido">🔊</button>
<div class="wrap" id="app"></div>
<script src="data.js"></script>
<script>
/* ---------- Sonidos (mismos que la app de verbos; la preferencia de silencio es común) ---------- */
let AC = null, MUTED = false;
try{ MUTED = localStorage.getItem("verbos-mute")==="1"; }catch(e){}
function audioCtx(){
  try{
    if(!AC){ const C = window.AudioContext||window.webkitAudioContext; if(!C) return null; AC = new C(); }
    if(AC.state==="suspended") AC.resume();
  }catch(e){ return null; }
  return AC;
}
function unlockAudio(){
  const c = audioCtx(); if(!c) return;
  try{ const b=c.createBuffer(1,1,22050), s=c.createBufferSource(); s.buffer=b; s.connect(c.destination); s.start(0); }catch(e){}
  ["touchstart","touchend","pointerdown","mousedown","keydown"].forEach(ev=>document.removeEventListener(ev,unlockAudio,true));
}

function tone(freq, start, dur, type, vol){
  const c = audioCtx(); if(!c) return;
  const t = c.currentTime + start, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.05);
}

function sfxReveal(){ if(MUTED) return; try{ tone(1567.98,0,.5,"sine",.16); tone(3135.96,0,.25,"sine",.04); }catch(e){} }

/* Voz en inglés para el vocabulario */
let VOICE = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
    if(!vs.length) return;
    const score = v => (/natural|neural|premium|enhanced|siri/i.test(v.name)?100:0) + (/Google UK English Female|Google US English|Samantha|Serena|Kate|Microsoft Sonia|Microsoft Libby|Microsoft Aria|Microsoft Jenny|Daniel/.test(v.name)?50:0) + (/en-GB/i.test(v.lang)?5:/en-US/i.test(v.lang)?4:0) - (/compact|eloquence|novelty|whisper|zarvox|albert|fred|junior|ralph|jester|organ|superstar|grandpa|grandma/i.test(v.name)?200:0);
    VOICE = vs.sort((a,b)=>score(b)-score(a))[0];
  }catch(e){}
}
try{ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}
function speak(t){
  try{
    speechSynthesis.cancel(); if(!VOICE) pickVoice();
    const u = new SpeechSynthesisUtterance(t);
    if(VOICE){ u.voice = VOICE; u.lang = VOICE.lang; } else u.lang = "en-GB";
    u.rate = .8; speechSynthesis.speak(u);
  }catch(e){}
}

/* Preguntas al azar solo de las secciones elegidas, repartidas por igual entre ellas y variando el tipo */
function buildExam(secs, n){
  let spots = 0;
  const lists = {};
  secs.forEach(g=>{
    const fams = {};
    shuffle(qsOf(g)).forEach(q=>(fams[famOf(q)] ||= []).push(q));
    const order = shuffle(Object.keys(fams)), out = [];
    while(order.some(f=>fams[f].length)) order.forEach(f=>{ if(fams[f].length) out.push(fams[f].shift()); });
    lists[g] = out;
  });
  const take = g => { const L = lists[g]; while(L.length){ const q = L.shift(); if(q.t==="spot"){ if(spots>=SPOT_MAX) continue; spots++; } return q; } return null; };
  const quota = Object.fromEntries(secs.map(g=>[g, Math.floor(n/secs.length)]));
  shuffle(secs).slice(0, n % secs.length).forEach(g=>quota[g]++);
  const chosen = [];
  let missing = 0;
  secs.forEach(g=>{ for(let k=0;k<quota[g];k++){ const q = take(g); if(q) chosen.push(q); else { missing += quota[g]-k; break; } } });
  while(missing>0){
    let moved = false;
    for(const g of shuffle(secs)){ if(missing<=0) break; const q = take(g); if(q){ chosen.push(q); missing--; moved = true; } }
    if(!moved) break;
  }
  return shuffle(chosen).map(q=>q.id);
}
/* Prepara una pregunta: baraja opciones, elige imagen, elige parejas */
function instance(id){
  const q = BYID[id], o = {id};
  if(q.img) o.img = Array.isArray(q.img) ? pick(q.img) : q.img;
  if(q.t==="mc") o.opts = shuffle([q.a, ...q.o]);
  if(q.t==="order"){ let s; do{ s = shuffle(q.a); } while(s.join("|")===q.a.join("|")); o.items = s; }
  if(q.t==="build"){ const n = words(q.a).length; let s; do{ s = shuffle([...Array(n).keys()]); } while(n>1 && s.every((v,i)=>v===i)); o.items = s; }
  if(q.t==="match"){
    const pool = q.pool;
    const seenR = new Set(), pairs = [];
    for(const p of shuffle(pool)){ if(pairs.length>=q.n) break; if(seenR.has(p[1])) continue; seenR.add(p[1]); pairs.push(p); }
    o.pairs = pairs; o.right = shuffle(pairs.map(p=>p[1]));
  }
  return o;
}

/* Instrucción fija por tipo (con ejemplo en los tipos nuevos) y pista en español 🇪🇸 */
function insHTML(q, inst){
  const short = o => o.every(x=>x.split(/\s+/).length<=2);
  const verb = q.t==="gap" && /___[^(]*\([^)]+\)/.test(q.q);
  const I = ({
    mc: () => [q.img && !q.q.includes("___") ? "Look and choose." : (inst.opts && short(inst.opts) ? "Choose the correct word." : "Choose the correct answer."), ""],
    tf: () => ["True or false?", ""],
    gap: () => verb ? ["Write the verb in the correct form.", "Example: Yesterday I ___ (play) football. → <b>played</b>"]
              : [q.a.some(a=>/\s/.test(a)) ? "Write the words." : "Write the word.", ""],
    build: () => ["Put the words in order.", "Example: name / is / My / Tom → <b>My name is Tom.</b>"],
    match: () => ["Match.", "Tap a word on the left, then its partner on the right."],
    order: () => ["Put in order.", "Tap them in the right order."],
    spot: () => ["Look at the picture. Tap the number.", ""],
    open: () => ["Answer out loud. Your mum or dad checks.", ""]
  }[q.t] || (() => ["",""]))();
  const ins = q.ins || I[0], ex = q.ex || I[1];

}

const words = s => s.replace(/[.!?]+$/,"").split(/\s+/).filter(Boolean);
const normS = s => s.toLowerCase().replace(/[.,!?]/g,"").replace(/\s+/g," ").trim();

/* Frase completa en inglés para escucharla (🔊) */
function sentenceOf(q){
  const fill = (t, a) => t.replace(/\s*\([^)]*\)/g,"").replace(/^.*?→\s*/,"").replace(/^[^"]*"(.*)"\s*$/,"$1").replace("___", a).replace(/…/g,"").trim();
  if(q.t==="build") return q.a;
  if(q.t==="gap") return fill(q.q, q.a[0]);
  if(q.t==="mc" && q.q.includes("___")) return fill(q.q, q.a);
  if(q.t==="tf") return q.a ? q.q.replace(/"/g,"") : (q.fix||"");
  return "";
}

function rightText(q, inst){
  if(q.t==="mc") return q.a;

  if(q.t==="gap") return q.q.replace("___", q.a[0]);

  const full = d.res.filter(r=>r.pts>=1).length, zero = d.res.filter(r=>r.pts<=0).length, half = n-full-zero;
  const rows = d.qs.map((inst,i)=>({inst, r:d.res[i], q:BYID[inst.id]}));
  const wrong = rows.filter(x=>x.r && x.r.pts<1).sort((a,b)=>SECNO[a.q.g]-SECNO[b.q.g]);
  const secs = [...new Set(rows.map(x=>x.q.g))].sort((a,b)=>SECNO[a]-SECNO[b]);
  const bySec = secs.map(g=>{ const rs = rows.filter(x=>x.q.g===g); const p = rs.reduce((s,x)=>s+(x.r?x.r.pts:0),0); return {g, n:rs.length, p, nota:Math.round(p/rs.length*100)/10}; });
  const scope = (d.secs||secs).length===CARDS.length ? "Whole unit" : (d.secs||secs).length===1 ? `Section ${secLabel((d.secs||secs)[0])}` : `Sections ${(d.secs||secs).map(g=>SECNO[g]).sort((a,b)=>a-b).join(", ")}`;
  const stars = g>=9?3: g>=7?2: g>=5?1:0;
  if(g>=9) confetti();
  const msg = g>=9?"Outstanding! 🏆": g>=7?"Very good! 🌟": g>=5?"You passed! 👍":"Keep studying! 💪";
  app.innerHTML = `
    <div class="hello"><div class="owl" aria-hidden="true">${META.mascot}</div><div class="bubble"><h1>${msg}</h1><p>${esc(scope)} · ${n} questions</p></div></div>
    <div class="q end">
      <div class="stars">${[0,1,2].map(k=>`<span class="${k<stars?"":"off"}">⭐</span>`).join("")}</div>
      <p class="prompt">Nota</p>
      <div class="big">${fmtG(g)} <small>/ 10</small></div>
      <div class="score2"><div class="y">✅ ${full}</div>${half?`<div class="h">½ ${half}</div>`:""}<div class="n">❌ ${zero}</div></div>
      ${bySec.length>1?`<div class="mist"><h3>📊 By section</h3>${bySec.map(b=>`<div class="bysec"><span>${esc(secLabel(b.g))}</span><b class="${b.nota>=5?"pass":"fail"}">${fmtG(b.nota)}</b><small>${fmtG(Math.round(b.p*10)/10)}/${b.n}</small></div>`).join("")}</div>`:""}
      ${wrong.length?`<div class="mist"><h3>📌 To study (${wrong.length})</h3>
        ${wrong.map(x=>`<div class="mrow"><span class="sectag">§ ${esc(secLabel(x.q.g))}</span><div class="e">${esc(x.q.q || x.q.es || "")}</div><div class="f">✔ <b>${esc(rightText(x.q,x.inst))}</b>${x.r.given && x.q.t!=="open"?`<br>Your answer: ${esc(x.r.given)}`:""}</div></div>`).join("")}
      </div>
      <button class="go" id="exRep">🔁 Repeat only the mistakes (${wrong.length})</button>`:""}
      <button class="go alt" id="exNew">New exam 📝</button>
      <button class="go alt" id="menu">Menu</button>
    </div>`;
  const r=$("exRep"); if(r) r.onclick=()=>examStart(shuffle(wrong.map(x=>x.inst.id)), d.secs);
  $("exNew").onclick=examSetup;
  $("menu").onclick=home;
}

document.title = META.title;
home();
</script>
</body>
</html>
